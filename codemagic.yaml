workflows:
  android-workflow:
    name: Android Workflow
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Create Android folder if missing
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      
