name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Recreate Clean Android Platform & Fix SDK via Python
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=kids_game

          mkdir -p android/gradle/wrapper
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-7.6.3-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          mkdir -p android
          touch android/gradle.properties
          if ! grep -q "flutter.minSdkVersion" android/gradle.properties; then
            echo "flutter.minSdkVersion=21" >> android/gradle.properties
          fi

          # استخدام سكريبت بايثون لتعديل ملف build.gradle بدقة تامة ومنع أخطاء الـ sed
          python3 -c '
          import re
          build_path = "android/app/build.gradle"
          with open(build_path, "r") as f:
              content = f.read()

          if "namespace" not in content:
              content = content.replace("android {", "android {\n    namespace \"com.example.kids_game\"")

          content = re.sub(r"minSdkVersion\s+.*", "minSdkVersion 21", content)

          with open(build_path, "w") as f:
              f.write(content)
          '

          chmod +x android/gradlew

      - name: Clean and Build APK Release
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
