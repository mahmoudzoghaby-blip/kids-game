name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Create Android Platform
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name=kids_game
          fi

      - name: Safe Android Configuration
        run: |
          chmod +x android/gradlew
          
          # تأكد من وجود gradle.properties وإضافة الـ minSdkVersion داخله بأمان
          mkdir -p android
          touch android/gradle.properties
          if ! grep -q "flutter.minSdkVersion" android/gradle.properties; then
            echo "flutter.minSdkVersion=21" >> android/gradle.properties
          fi

          # إضافة الـ namespace بشكل مضمون وسليم
          BUILD_FILE="android/app/build.gradle"
          if [ -f "$BUILD_FILE" ] && ! grep -q "namespace" "$BUILD_FILE"; then
            # وضع الـ namespace بجانب الـ applicationId أو في أعلى ملف build.gradle
            sed -i '0,/android {/{s/android {/android {\n    namespace "com.example.kids_game"/}' "$BUILD_FILE"
          fi

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
