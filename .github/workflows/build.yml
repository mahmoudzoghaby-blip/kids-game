name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Create Android Platform
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name=kids_game
          fi

      - name: Fix Android Configuration
        run: |
          chmod +x android/gradlew
          
          mkdir -p android
          touch android/gradle.properties
          echo "flutter.minSdkVersion=21" >> android/gradle.properties

          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle
          fi

          if [ -f "android/app/build.gradle" ] && ! grep -q "namespace" android/app/build.gradle; then
            sed -i '/android {/a \    namespace "com.example.kids_game"' android/app/build.gradle
          fi

          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:label="[^"]*"/android:label="ألعاب تعليمية"/g' android/app/src/main/AndroidManifest.xml || true
          fi

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
