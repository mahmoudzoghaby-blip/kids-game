name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Gradle and SDK Version
        run: |
          # رفع الـ minSdkVersion إلى 24 لتوافق جميع الحزم الحديثة وتجنب أخطاء البناء
          mkdir -p android
          if [ -f "android/gradle.properties" ]; then
            sed -i 's/flutter.minSdkVersion=.*/flutter.minSdkVersion=24/g' android/gradle.properties
            if ! grep -q "flutter.minSdkVersion" android/gradle.properties; then
              echo "flutter.minSdkVersion=24" >> android/gradle.properties
            fi
          else
            echo "flutter.minSdkVersion=24" > android/gradle.properties
          fi

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
